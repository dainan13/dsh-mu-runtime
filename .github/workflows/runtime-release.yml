name: runtime-release

# 手工触发：Actions → runtime-release → Run workflow（打 tag 不会触发）
# 产物：dsh-<id>.squashfs + dsh-<id>.manifest.json + SHA256SUMS
# 若 channel != none，会把这一条写进 channels/channels.json 并提交（默认 / alpha 两个指针）
on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "DSH 版本（含预发布）：0.2.1-rc.5 / 0.2.2-rc.1 / 0.2.3-alpha.1"
        required: true
      rev:
        description: "构建修订号（同一 DSH 版本重打包就 +1）"
        required: true
        default: "0"
      variant:
        description: "变体（留空 = plain；例如 vscode）"
        required: false
        default: ""
      channel:
        description: "登记到哪个通道（none = 只发 release）"
        type: choice
        options: [none, default, alpha]
        default: none
      arch:
        description: "架构"
        type: choice
        options: [x86_64]
        default: x86_64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate inputs
        run: |
          set -eu
          V="${{ inputs.dsh_version }}"
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::dsh_version 应形如 0.2.1-rc.5 / 0.2.2"; exit 1 ;;
          esac
          case "${{ inputs.rev }}" in ''|*[!0-9]*) echo "::error::rev 必须是整数"; exit 1 ;; esac

      - name: Build (node:24-alpine, prune, prebuilt pty.node, mksquashfs)
        env:
          ARCH: ${{ inputs.arch }}
          VARIANT: ${{ inputs.variant }}
        # 注意：用 `sh ./build.sh` 而不是 `./build.sh`
        # —— 仓库里的可执行位可能丢失，直接执行会 exit 126（踩过）
        run: sh ./build.sh "${{ inputs.dsh_version }}" "${{ inputs.rev }}"

      - name: Collect assets
        id: a
        run: |
          set -eu
          V="${{ inputs.dsh_version }}"; R="${{ inputs.rev }}"; VAR="${{ inputs.variant }}"
          PKGVER="$(printf '%s' "$V" | sed -e 's/\([0-9]\)-rc\.\([0-9]\)/\1_rc\2/' \
                                           -e 's/\([0-9]\)-beta\.\([0-9]\)/\1_beta\2/' \
                                           -e 's/\([0-9]\)-alpha\.\([0-9]\)/\1_alpha\2/' \
                                           -e 's/-/_/g')"
          ID="$V${VAR:+-$VAR}"
          if [ "$R" != "0" ]; then ID="$ID-r$R"; fi
          ls -l dist
          test -f "dist/dsh-$V.squashfs" || { echo "::error::missing dist/dsh-$V.squashfs"; exit 1; }
          # rev=0 时 ID == V（都叫 0.2.1-rc.5）→ 不能 cp 到同一个名字 ✗（踩过）
          if [ "$ID" != "$V" ]; then
            cp "dist/dsh-$V.squashfs" "dist/dsh-$ID.squashfs"
            cp "dist/dsh-$V.manifest.json" "dist/dsh-$ID.manifest.json"
          fi
          # 容器里生成的 SHA256SUMS 属于 root ✗ runner 覆盖会 EACCES → 先 sudo 删掉再生成
          sudo rm -f dist/SHA256SUMS
          ( cd dist && sha256sum "dsh-$ID.squashfs" > SHA256SUMS && cat SHA256SUMS )
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "dist/dsh-$ID.squashfs" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          is_pre=false
          case "$V" in *-alpha.*|*-beta.*|*-rc.*) is_pre=true ;; esac
          echo "prerelease=$is_pre" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-${{ steps.a.outputs.id }}
          name: dsh-mu-runtime ${{ steps.a.outputs.id }}
          files: |
            dist/dsh-${{ steps.a.outputs.id }}.squashfs
            dist/dsh-${{ steps.a.outputs.id }}.manifest.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ steps.a.outputs.prerelease }}

      - name: Update the channel pointer (channels.json)
        if: inputs.channel != 'none'
        env:
          CH: ${{ inputs.channel }}
          V: ${{ inputs.dsh_version }}
          R: ${{ inputs.rev }}
          VAR: ${{ inputs.variant }}
          ID: ${{ steps.a.outputs.id }}
          SHA: ${{ steps.a.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          URL="https://github.com/$REPO/releases/download/runtime-$ID/dsh-$ID.squashfs"
          python3 - "$CH" "$V" "$ID" "$R" "$SHA" "$URL" "$VAR" <<'PY'
          import json, sys
          ch, dsh, rid, rev, sha, url, var = sys.argv[1:8]
          p = "channels/channels.json"
          doc = json.load(open(p))
          row = {"id": rid, "dsh": dsh, "rev": int(rev), "variant": var or "plain",
                 "sha256": sha, "url": url}
          if ch == "default":
              doc["default"] = row
              doc["alpha"] = [a for a in doc.get("alpha", []) if a.get("id") != rid]
          else:
              doc["alpha"] = [a for a in doc.get("alpha", []) if a.get("id") != rid] + [row]
          open(p, "w").write(json.dumps(doc, indent=2, ensure_ascii=False) + "\n")
          print(json.dumps(doc, ensure_ascii=False)[:300])
          PY
          git config user.name "runtime-release"
          git config user.email "runtime-release@users.noreply.github.com"
          git add channels/channels.json
          git commit -m "channels: $CH -> $ID" || true
          git push
