name: runtime-release

# 手工触发（Actions → runtime-release → Run workflow）。
# 表单字段见下；打 tag **不**触发（避免"打了个 tag 就意外发版"）。
on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "DSH 版本，含预发布：0.2.2-rc.1 / 0.2.3-alpha.1 / 0.2.3"
        required: true
      rev:
        description: "构建修订号（我们自己重打包时 +1；DSH 版本不变则 rev 必须不同）"
        required: true
        default: "0"
      channel:
        description: "把结果登记到哪个通道（none = 只发 release，不改默认）"
        type: choice
        options: [none, default, alpha]
        default: none
      arch:
        description: "架构"
        type: choice
        options: [x86_64]
        default: x86_64
      repo_base:
        description: "本仓库 raw 根（用于更新 channels.json），一般不用改"
        required: false
        default: "https://raw.githubusercontent.com/dainan13/dsh-mu-runtime/main"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          set -eu
          V="${{ inputs.dsh_version }}"
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::dsh_version must look like 0.2.2 / 0.2.2-rc.1 / 0.2.3-alpha.1"; exit 1 ;;
          esac
          case "${{ inputs.rev }}" in ''|*[!0-9]*) echo "::error::rev must be an integer"; exit 1 ;; esac

      - name: Build (node:24-alpine, prune, prebuilt pty.node)
        env:
          ARCH: ${{ inputs.arch }}
        run: ./build.sh "${{ inputs.dsh_version }}" "${{ inputs.rev }}"

      - name: Collect assets
        id: a
        run: |
          set -eu
          V="${{ inputs.dsh_version }}"; R="${{ inputs.rev }}"
          PKGVER="$(printf '%s' "$V" | sed -e 's/\([0-9]\)-rc\.\([0-9]\)/\1_rc\2/' \
                                           -e 's/\([0-9]\)-beta\.\([0-9]\)/\1_beta\2/' \
                                           -e 's/\([0-9]\)-alpha\.\([0-9]\)/\1_alpha\2/' \
                                           -e 's/-/_/g')"
          APK="dsh-mu-runtime-$PKGVER-r$R.apk"
          cp "dist/dsh-mu-runtime-$PKGVER-r0.apk" "dist/$APK"
          cp "dist/dsh-mu-runtime-$PKGVER-r0.apk" dist/dsh-mu-runtime.apk
          ( cd dist && sha256sum "$APK" dsh-mu-runtime.apk > SHA256SUMS )
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "dist/$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          is_pre=false
          case "$V" in *-alpha.*|*-beta.*|*-rc.*) is_pre=true ;; esac
          echo "prerelease=$is_pre" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-v${{ steps.a.outputs.pkgver }}-r${{ inputs.rev }}
          name: dsh-mu-runtime ${{ inputs.dsh_version }} (r${{ inputs.rev }})
          files: |
            dist/${{ steps.a.outputs.apk }}
            dist/dsh-mu-runtime.apk
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ steps.a.outputs.prerelease }}

      - name: Update the channel pointer (channels.json)
        if: inputs.channel != 'none'
        env:
          CH: ${{ inputs.channel }}
          V: ${{ inputs.dsh_version }}
          R: ${{ inputs.rev }}
          PKGVER: ${{ steps.a.outputs.pkgver }}
          SHA: ${{ steps.a.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          TAG="runtime-v$PKGVER-r$R"
          URL="https://github.com/$REPO/releases/download/$TAG/dsh-mu-runtime-$PKGVER-r$R.apk"
          python3 - "$CH" "$V" "$PKGVER" "$R" "$SHA" "$URL" <<'PY'
          import json, sys
          ch, dsh, pkgver, rev, sha, url = sys.argv[1:7]
          p = "channels/channels.json"
          doc = json.load(open(p))
          row = {"dsh": dsh, "pkgver": pkgver, "rev": int(rev), "sha256": sha, "url": url}
          if ch == "default":
              doc["default"] = row
              doc["alpha"] = [a for a in doc.get("alpha", []) if a.get("dsh") != dsh]
          else:  # alpha 通道：追加/替换同版本条目，绝不动 default
              doc["alpha"] = [a for a in doc.get("alpha", []) if a.get("dsh") != dsh] + [row]
          open(p, "w").write(json.dumps(doc, indent=2, ensure_ascii=False) + "\n")
          print("channels.json ->", json.dumps(doc, ensure_ascii=False)[:200])
          PY
          git config user.name "runtime-release"
          git config user.email "runtime-release@users.noreply.github.com"
          git add channels/channels.json
          git commit -m "channels: $CH -> $V (r$R)" || true
          git push
